<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Третьяковка">
<meta name="theme-color" content="#14100c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Третьяковка: угадай картину</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#231d18;
    --wall-2:#2c241d;
    --frame:#7a5a30;
    --frame-light:#b8935a;
    --card:#2a2119;
    --cream:#efe6d6;
    --cream-dim:#c9bda6;
    --gold:#c9a769;
    --green:#7c9a72;
    --red:#b3584c;
    --shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #34291f 0%, var(--wall) 55%, #1a1512 100%);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:36px 16px 60px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  .eyebrow{
    text-align:center;
    font-family:'Inter',sans-serif;
    letter-spacing:.25em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--gold);
    margin-bottom:8px;
  }
  h1{
    font-family:'Playfair Display',serif;
    font-weight:700;
    text-align:center;
    font-size:34px;
    margin:0 0 6px;
    color:var(--cream);
  }
  .sub{
    text-align:center;
    color:var(--cream-dim);
    font-size:14px;
    margin-bottom:30px;
  }

  .progressRow{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:18px;
    font-size:13px;
    color:var(--cream-dim);
  }
  .progressBar{
    flex:1;
    height:3px;
    background:rgba(255,255,255,0.1);
    position:relative;
    border-radius:2px;
    overflow:hidden;
  }
  .progressFill{
    position:absolute;left:0;top:0;bottom:0;
    background:linear-gradient(90deg,var(--frame-light),var(--gold));
    transition:width .4s ease;
  }
  .score{color:var(--gold);font-weight:600;white-space:nowrap;}
  .homeBtn{
    background:transparent;
    border:1px solid rgba(201,167,105,0.3);
    color:var(--cream-dim);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:7px 12px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .2s, color .2s;
  }
  .homeBtn:hover{border-color:var(--gold);color:var(--cream);}

  .frame{
    background:linear-gradient(160deg,#8a6a3a,#5c421f 40%,#8a6a3a);
    padding:14px;
    border-radius:4px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .frame::before{
    content:'';
    position:absolute;inset:6px;
    border:1px solid rgba(255,255,255,0.15);
    pointer-events:none;
    border-radius:2px;
  }
  .canvas{
    background:#100c09;
    aspect-ratio:4/3;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    border-radius:1px;
  }
  .canvas img{
    width:100%;height:100%;object-fit:contain;
    display:block;
    background:#0c0906;
  }
  .fallback{
    width:100%;height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:34px;
    background:
      repeating-linear-gradient(135deg, #1c1712 0 2px, #191410 2px 4px);
  }
  .fallback .glyph{
    font-family:'Cormorant Garamond',serif;
    font-size:52px;
    color:var(--gold);
    margin-bottom:14px;
    font-style:italic;
  }
  .fallback p{
    color:var(--cream-dim);
    font-size:14.5px;
    line-height:1.55;
    max-width:400px;
    margin:0;
  }

  .placard{
    margin-top:22px;
    background:var(--card);
    border:1px solid rgba(201,167,105,0.18);
    border-radius:10px;
    padding:26px 24px;
    box-shadow:var(--shadow);
  }
  .placard label{
    display:block;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  .field{margin-bottom:16px;}
  .field input{
    width:100%;
    background:#1a140f;
    border:1px solid rgba(201,167,105,0.25);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    font-size:16px;
    padding:12px 14px;
    border-radius:6px;
    outline:none;
    transition:border-color .2s;
  }
  .field input:focus{border-color:var(--gold);}
  .field input:disabled{opacity:.75;}

  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;}
  button{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:7px;
    padding:13px 22px;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{
    background:linear-gradient(160deg,var(--frame-light),#96712f);
    color:#1a140f;
    flex:1;
  }
  .btn-primary:hover{opacity:.92;}
  .btn-ghost{
    background:transparent;
    border:1px solid rgba(201,167,105,0.35);
    color:var(--cream-dim);
  }
  .btn-ghost:hover{color:var(--cream);border-color:var(--gold);}
  button:disabled{opacity:.4;cursor:default;}

  .reveal{
    margin-top:20px;
    padding-top:18px;
    border-top:1px dashed rgba(201,167,105,0.25);
    display:none;
  }
  .reveal.show{display:block;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .verdict{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:19px;
    margin-bottom:12px;
  }
  .verdict.correct{color:var(--green);}
  .verdict.wrong{color:var(--red);}

  .answerCard{
    background:rgba(0,0,0,0.2);
    border-left:3px solid var(--gold);
    padding:14px 16px;
    border-radius:0 6px 6px 0;
  }
  .answerCard .t{
    font-family:'Playfair Display',serif;
    font-size:20px;
    color:var(--cream);
    margin:0 0 4px;
  }
  .answerCard .a{
    color:var(--gold);
    font-size:14.5px;
    margin:0 0 6px;
  }
  .answerCard .y{
    color:var(--cream-dim);
    font-size:12.5px;
    letter-spacing:.05em;
  }

  .yourAnswers{
    margin-top:12px;
    font-size:13px;
    color:var(--cream-dim);
    display:grid;
    gap:3px;
  }
  .yourAnswers b{color:var(--cream);font-weight:600;}

  .finalScreen{text-align:center;padding:50px 20px;}
  .finalScreen .big{
    font-family:'Playfair Display',serif;
    font-size:48px;
    color:var(--gold);
    margin:6px 0 4px;
  }
  .finalScreen p{color:var(--cream-dim);}

  footer{
    text-align:center;
    margin-top:30px;
    font-size:12px;
    color:rgba(201,189,166,0.4);
  }
  .periodIntro{
    text-align:center;
    color:var(--cream-dim);
    font-size:14.5px;
    margin-bottom:22px;
    line-height:1.5;
  }
  .periodGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .periodCard{
    text-align:left;
    background:var(--card);
    border:1px solid rgba(201,167,105,0.18);
    border-radius:10px;
    padding:18px 16px;
    cursor:pointer;
    transition:border-color .2s, transform .15s;
    color:var(--cream);
  }
  .periodCard:hover{border-color:var(--gold);transform:translateY(-2px);}
  .periodCard:disabled{opacity:.35;cursor:default;transform:none;}
  .periodCard.periodAll{
    grid-column:1 / -1;
    background:linear-gradient(160deg, rgba(201,167,105,0.14), rgba(201,167,105,0.04));
    border-color:rgba(201,167,105,0.4);
  }
  .periodTitle{
    font-family:'Playfair Display',serif;
    font-size:18px;
    color:var(--cream);
    margin-bottom:2px;
  }
  .periodRange{
    font-size:11.5px;
    letter-spacing:.04em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .periodDesc{
    font-size:13px;
    color:var(--cream-dim);
    margin-bottom:10px;
    line-height:1.4;
  }
  .periodCount{
    font-size:12px;
    color:rgba(201,189,166,0.6);
  }
  @media(max-width:520px){
    .periodGrid{grid-template-columns:1fr;}
  }
  @media(max-width:480px){
    h1{font-size:26px;}
    .placard{padding:20px 16px;}
  }
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px;}
  body{-webkit-text-size-adjust:100%;}
  .offlineBox{margin:22px 0 8px;text-align:center}
  #offlineStatus{margin-top:8px;font-size:13px;color:var(--cream);opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Государственная Третьяковская галерея</div>
  <h1>Угадай картину</h1>
  <div class="sub">Назовите автора и название полотна из собрания галереи</div>

  <div class="progressRow" id="progressRow" style="display:none">
    <button class="homeBtn" id="homeBtn" title="К выбору эпохи">← На главную</button>
    <span id="qCounter">Вопрос 1 из 24</span>
    <div class="progressBar"><div class="progressFill" id="progressFill" style="width:4%"></div></div>
    <span class="score" id="scoreLabel">0 верных</span>
  </div>

  <div id="periodArea"></div>
  <div id="quizArea" style="display:none"></div>

  <div id="finalArea" style="display:none"></div>

  <footer>Изображения — общественное достояние (Wikimedia Commons), собрание ГТГ</footer>
</div>

<script>

/* ---------- Офлайн: сервис-воркер + предзагрузка картинок ---------- */
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
function initOffline(){
  const btn=document.getElementById('offlineBtn'), st=document.getElementById('offlineStatus');
  if(!btn) return;
  try{ if(localStorage.getItem('offlineDone')) st.textContent='Картины сохранены, можно без интернета.'; }catch(e){}
  btn.onclick=async()=>{
    if(!navigator.onLine){ st.textContent='Нужен интернет для первой загрузки.'; return; }
    btn.disabled=true; let ok=0, fail=0, i=0; const miss=[]; const list=PAINTINGS.slice();
    async function worker(){
      while(i<list.length){
        const p=list[i++];
        try{
          const lu=localUrl(p);
          if(!lu&&!p.file) throw 0;
          let r=lu?await fetch(lu):await fetch(fileUrl(p.file),{mode:'no-cors'});
          if(!r||(r.type!=='opaque'&&!r.ok)) throw 0;
          ok++;
        }catch(e){
          try{ const u=await findImage(p); if(u){ await fetch(u,{mode:'no-cors'}); ok++; } else { fail++; miss.push(p.author+' — '+p.title); } }catch(e2){ fail++; miss.push(p.author+' — '+p.title); }
        }
        st.textContent='Загружено '+(ok+fail)+' из '+list.length;
      }
    }
    await Promise.all([worker(),worker(),worker(),worker()]);
    st.textContent='Готово: сохранено '+ok+', без картинки '+fail+'.';
    if(miss.length){ const t=document.createElement('textarea'); t.readOnly=true; t.value=miss.join('\n'); t.style.cssText='width:100%;height:140px;margin-top:8px;font-size:16px;background:#1a140f;color:#f3e9d2;border:1px solid #c9a769;border-radius:6px'; st.appendChild(document.createElement('br')); st.appendChild(t); }
    try{ localStorage.setItem('offlineDone','1'); }catch(e){}
    btn.disabled=false;
  };
}

const PAINTINGS = [
  {author:"Иван Шишкин, Константин Савицкий", title:"Утро в сосновом лесу", year:"1889",
   file:"Shishkin, Ivan - Morning in a Pine Forest.jpg",
   hint:"Пейзаж с сосновым лесом в тумане, на переднем плане резвится медвежье семейство. Известна в народе как «Три медведя»."},
  {author:"Виктор Васнецов", title:"Богатыри", year:"1898",
   file:"Viktor Vasnetsov - Богатыри - Google Art Project.jpg",
   hint:"Три всадника-воина на конях всматриваются вдаль в степи — Илья Муромец, Добрыня Никитич и Алёша Попович."},
  {author:"Виктор Васнецов", title:"Алёнушка", year:"1881",
   file:"Vasnetsov Alenushka.jpg",
   hint:"Печальная босоногая девушка сидит на камне у лесного омута, склонив голову на колени."},
  {author:"Василий Суриков", title:"Боярыня Морозова", year:"1887",
   file:"Boyaryna Morozova by V.Surikov (1884-1887, Tretyakov gallery).jpg",
   hint:"Женщину в чёрном везут на санях по заснеженной московской улице, она подняла руку с двуперстным крестным знамением."},
  {author:"Илья Репин", title:"Иван Грозный и сын его Иван 16 ноября 1581 года", year:"1885",
   file:"REPIN Ivan Terrible&Ivan.jpg",
   hint:"Царь в ужасе обнимает и держит на руках смертельно раненного сына; на полу — рассыпанный ковёр и кровь."},
  {author:"Александр Иванов", title:"Явление Христа народу", year:"1837–1857",
   file:"Александр Андреевич Иванов - Явление Христа народу (Явление Мессии) - Google Art Project.jpg",
   hint:"Огромное полотно: Иоанн Креститель указывает толпе на приближающуюся вдали фигуру Христа у реки Иордан."},
  {author:"Иван Крамской", title:"Неизвестная", year:"1883",
   file:"Kramskoy Portrait of a Woman.jpg",
   hint:"Элегантная дама в открытом экипаже на фоне зимнего Невского проспекта, взгляд свысока обращён на зрителя."},
  {author:"Иван Крамской", title:"Христос в пустыне", year:"1872",
   file:"Ivan Kramskoy - Христос в пустыне - Google Art Project.jpg",
   hint:"Одинокая фигура сидит на камне среди пустынных холмов на рассвете, погружённая в тяжёлые раздумья."},
  {author:"Алексей Саврасов", title:"Грачи прилетели", year:"1871",
   file:"Aleksey Savrasov - Грачи прилетели - Google Art Project.jpg",
   hint:"Ранняя весна, талый снег, берёзы с грачиными гнёздами на фоне сельской церкви."},
  {author:"Михаил Врубель", title:"Демон сидящий", year:"1890",
   file:"Vrubel Demon.jpg",
   hint:"Мощная печальная фигура полуобнажённого юноши сидит, обхватив колени, среди фантастических кристаллических цветов заката."},
  {author:"Валентин Серов", title:"Девочка с персиками", year:"1887",
   file:"Valentin Serov - Девочка с персиками. Портрет В.С.Мамонтовой - Google Art Project.jpg",
   hint:"Портрет темноволосой девочки за столом с персиками в светлой комнате с солнечными пятнами."},
  {author:"Валентин Серов", title:"Похищение Европы", year:"1910",
   file:"Serov Rape of Europa.jpg",
   hint:"Девушка на спине плывущего по морю быка среди дельфинов — сюжет древнегреческого мифа."},
  {author:"Кузьма Петров-Водкин", title:"Купание красного коня", year:"1912",
   file:"Bathing of a Red Horse (Petrov-Vodkin).jpg",
   hint:"Обнажённый юноша верхом на огромном ярко-красном коне посреди воды."},
  {author:"Василий Верещагин", title:"Апофеоз войны", year:"1871",
   file:"Vasily Vereshchagin - Апофеоз войны - Google Art Project.jpg",
   hint:"Пирамида из человеческих черепов посреди выжженной пустыни, над ней кружит вороньё."},
  {author:"Владимир Боровиковский", title:"Портрет М. И. Лопухиной", year:"1797",
   file:"Vladimir Borovikovskiy - Портрет М.И.Лопухиной - Google Art Project.jpg",
   hint:"Молодая женщина в белом платье облокотилась на каменный парапет среди пейзажа с колосьями и васильками."},
  {author:"Иван Айвазовский", title:"Радуга", year:"1873",
   file:"Айвазовский (Гайвазовский) Иван (Оганес) Константинович Радуга.jpg",
   hint:"Терпящий бедствие корабль среди бушующих волн, сквозь брызги пробивается радуга."},
  {author:"Борис Кустодиев", title:"Масленица", year:"1916",
   file:"Boris Kustodiyev - Масленица - Google Art Project.jpg",
   hint:"Праздничный заснеженный городок сверху, расписные сани с тройками лошадей, золотые купола вдали."},
  {author:"Николай Ге", title:"Пётр I допрашивает царевича Алексея Петровича в Петергофе", year:"1871",
   file:"Peter the Great Interrogating the Tsarevich Alexei Petrovich.jpg",
   hint:"Царь сидит за столом и гневно смотрит на понуро стоящего перед ним сына в кабинете с шахматной доской на полу."},
  {author:"Михаил Нестеров", title:"Видение отроку Варфоломею", year:"1890",
   file:"Mikhail Nesterov 001.jpg",
   hint:"Мальчик в холщовой рубахе стоит перед монахом-схимником на фоне тихого северного пейзажа с рябиной."},
  {author:"Исаак Левитан", title:"Золотая осень", year:"1895",
   file:"Golden Autumn. Золотая осень.jpg",
   hint:"Берёзы в жёлто-золотой листве на берегу извилистой реки под ярко-синим небом."},
  {author:"Илья Репин", title:"Не ждали", year:"1884–1888",
   file:"They did not Expect Him.jpg",
   hint:"В комнату неожиданно входит исхудавший мужчина — ссыльный, вернувшийся домой; семья застыла от неожиданности."},
  {author:"Василий Суриков", title:"Утро стрелецкой казни", year:"1881",
   file:"Vasily Surikov - Morning of the Strelets' Execution - Google Art Project.jpg",
   hint:"Толпа осуждённых стрельцов со свечами на Красной площади в ожидании казни на рассвете."},
  {author:"Казимир Малевич", title:"Чёрный супрематический квадрат", year:"1915",
   file:"Kazimir Malevich, 1915, Black Suprematic Square, oil on linen canvas, 79.5 x 79.5 cm, Tretyakov Gallery, Moscow.jpg",
   hint:"Один сплошной чёрный квадрат на белом фоне — манифест супрематизма."},
  {author:"Николай Рерих", title:"Заморские гости", year:"1901",
   file:"Nicholas Roerich, Guests from Overseas.jpg",
   hint:"Вереница нарядных ладей с полосатыми парусами и щитами на бортах плывёт по реке к далёкому городку."},
  {author:"Карл Брюллов", title:"Всадница", year:"1832",
   file:"Karl Bryullov (Bryullo) - Всадница - Google Art Project.jpg",
   hint:"Юная наездница на вздыбленном вороном коне подъезжает к крыльцу виллы, навстречу выбегает маленькая девочка в розовом."},
  {author:"Архип Куинджи", title:"Берёзовая роща", year:"1879",
   file:"Куинджи - Березовая роща 1901.jpg",
   hint:"Ярко освещённая солнцем лесная поляна между тёмными стволами берёз, контрастная светотень почти без полутонов."},
  {author:"Василий Перов", title:"Тройка", year:"1866",
   file:"Тройка - Василий Григорьевич Перов (1866).jpg",
   hint:"Трое измождённых детей тянут по обледенелой дороге сани с огромной бочкой воды на фоне монастырской стены."},
  {author:"Василий Пукирев", title:"Неравный брак", year:"1862",

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

  return fetch(url).then(r=>r.json()).then(pick).catch(()=>"");
}
function commonsSearch(q){
  return apiThumb("https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url|mime&iiurlwidth=600&gsrsearch="+encodeURIComponent(q), d=>{
    const pg=d&&d.query&&d.query.pages; if(!pg) return "";
    const arr=Object.keys(pg).map(k=>pg[k]).sort((a,b)=>(a.index||0)-(b.index||0));
    for(const x of arr){ const ii=x.imageinfo&&x.imageinfo[0]; if(ii&&/^image\/(jpeg|png)/.test(ii.mime||"")) return ii.thumburl||ii.url||""; }
    return "";
  });
}
function wikiSearch(q,lang){
  return apiThumb("https://"+lang+".wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=600&gsrsearch="+encodeURIComponent(q), d=>{
    const pg=d&&d.query&&d.query.pages; if(!pg) return "";
    const arr=Object.keys(pg).map(k=>pg[k]).sort((a,b)=>(a.index||0)-(b.index||0));
    for(const x of arr){ if(x.thumbnail&&x.thumbnail.source) return x.thumbnail.source; }
    return "";
  });
}
function findImage(p){
  const last=(p.author||"").split(" ").slice(-1)[0];
  const steps=[
    ()=>commonsSearch(p.title+" "+last),
    ()=>commonsSearch(p.author+" "+p.title+" Google Art Project"),
    ()=>wikiSearch(p.title+" "+p.author+" картина","ru"),
    ()=>wikiSearch(p.title+" "+p.author+" painting","en")
  ];
  return steps.reduce((acc,f)=>acc.then(u=>u||f()),Promise.resolve(""));
}

function normalize(s){
  return (s||"")
    .toLowerCase()
    .replace(/ё/g,"е")
    .replace(/[«»"'.,!?()–—-]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function lastNameOf(authorField){
  // take the first author, then its last word as surname
  const first = authorField.split(",")[0].trim();
  const parts = first.split(" ");
  return normalize(parts[parts.length-1]);
}

function titleKeyMatch(guess, title){
  const g = normalize(guess);
  const t = normalize(title);
  if(!g) return false;
  if(t.includes(g) || g.includes(t)) return true;
  const tWords = t.split(" ").filter(w=>w.length>3);
  if(tWords.length===0) return g===t;
  const hits = tWords.filter(w=>g.includes(w)).length;
  return hits >= Math.max(1, Math.ceil(tWords.length*0.5));
}

function authorMatch(guess, authorField){
  const g = normalize(guess);
  if(!g) return false;
  const surname = lastNameOf(authorField);
  return g.includes(surname) || surname.includes(g);
}

let order = [];
let idx = 0;
let score = 0;
let answered = false;
let currentPeriodId = null;

const periodArea = document.getElementById('periodArea');
const progressRow = document.getElementById('progressRow');
const homeBtn = document.getElementById('homeBtn');
homeBtn.addEventListener('click', ()=>renderPeriodSelect());
const quizArea = document.getElementById('quizArea');
const finalArea = document.getElementById('finalArea');
const qCounter = document.getElementById('qCounter');
const progressFill = document.getElementById('progressFill');
const scoreLabel = document.getElementById('scoreLabel');

function renderPeriodSelect(){
  progressRow.style.display = 'none';
  quizArea.style.display = 'none';
  finalArea.style.display = 'none';
  periodArea.style.display = 'block';

  const totalCount = PAINTINGS.length;
  const cards = PERIODS.map(per=>{
    const count = PAINTINGS.filter(p=>getPeriod(p)===per.id).length;
    if(count===0) return '';
    return `
      <button class="periodCard" data-period="${per.id}">
        <div class="periodTitle">${per.label}</div>
        <div class="periodRange">${per.range}</div>
        <div class="periodDesc">${per.desc}</div>
        <div class="periodCount">${count} ${countWord(count)}</div>
      </button>`;
  }).join('');

  periodArea.innerHTML = `
    <div class="periodIntro">Выберите эпоху для теста — картины будут только из этого раздела.</div>
    <div class="periodGrid">
      ${cards}
      <button class="periodCard periodAll" data-period="__all__">
        <div class="periodTitle">Все эпохи</div>
        <div class="periodRange">XII–XX века</div>
        <div class="periodDesc">Полный набор вперемешку</div>
        <div class="periodCount">${totalCount} картин</div>
      </button>
    </div>
    <div class="offlineBox"><button id="offlineBtn" class="btn-ghost">Сохранить картины для офлайна</button><div id="offlineStatus"></div></div>
  `;
  initOffline();

  periodArea.querySelectorAll('.periodCard').forEach(btn=>{
    btn.addEventListener('click', ()=>startQuiz(btn.dataset.period));
  });
}

function countWord(n){
  const mod10 = n%10, mod100 = n%100;
  if(mod100>=11 && mod100<=14) return "картин";
  if(mod10===1) return "картина";
  if(mod10>=2 && mod10<=4) return "картины";
  return "картин";
}

function startQuiz(periodId){
  currentPeriodId = periodId;
  const pool = periodId==="__all__" ? PAINTINGS : PAINTINGS.filter(p=>getPeriod(p)===periodId);
  order = shuffle(pool);
  idx = 0; score = 0;
  periodArea.style.display = 'none';
  progressRow.style.display = 'flex';
  quizArea.style.display = 'block';
  finalArea.style.display = 'none';
  render();
}

function updateProgress(){
  qCounter.textContent = `Вопрос ${idx+1} из ${order.length}`;
  progressFill.style.width = (((idx)/order.length)*100+4) + "%";
  scoreLabel.textContent = `${score} верных`;
}

function render(){
  answered = false;
  const p = order[idx];
  updateProgress();

  quizArea.innerHTML = `
    <div class="frame">
      <div class="canvas">
        <img id="paintImg" src="${localUrl(p)?localUrl(p):p.file?fileUrl(p.file):'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='}" alt="" referrerpolicy="no-referrer" loading="eager">
        <div class="fallback" id="fallbackCard" style="display:none">
          <div class="glyph">*</div>
          <p>${p.hint}</p>
        </div>
      </div>
    </div>
    <div class="placard">
      <div class="field">
        <label>Автор</label>
        <input type="text" id="authorInput" placeholder="Например: Иван Шишкин" autocomplete="off" autocapitalize="sentences" autocorrect="off" enterkeyhint="done">
      </div>
      <div class="field">
        <label>Название картины</label>
        <input type="text" id="titleInput" placeholder="Например: Утро в сосновом лесу" autocomplete="off" autocapitalize="sentences" autocorrect="off" enterkeyhint="done">
      </div>
      <div class="row">
        <button class="btn-primary" id="checkBtn">Ответить</button>
        <button class="btn-ghost" id="skipBtn">Не знаю, показать ответ</button>
      </div>
      <div class="reveal" id="revealBox"></div>
    </div>
  `;

  const img = document.getElementById('paintImg');
  const fb = document.getElementById('fallbackCard');
  const cur=p;
  let tried=false;
  if(!p.file&&!localUrl(p)){ tried=true; img.style.visibility='hidden'; findImage(cur).then(u=>{ if(order[idx]!==cur) return; if(u){ img.style.visibility=''; img.src=u; } else { img.style.display='none'; fb.style.display='flex'; } }); }
  img.addEventListener('error', ()=>{
    if(!tried){
      tried=true;
      findImage(cur).then(u=>{
        if(order[idx]!==cur) return;
        if(u){ img.src=u; } else { img.style.display='none'; fb.style.display='flex'; }
      });
      return;
    }
    img.style.display='none';
    fb.style.display='flex';
  });

  document.getElementById('checkBtn').addEventListener('click', ()=>checkAnswer(false));
  document.getElementById('skipBtn').addEventListener('click', ()=>checkAnswer(true));
  document.getElementById('authorInput').addEventListener('keydown', e=>{if(e.key==='Enter') checkAnswer(false);});
  document.getElementById('titleInput').addEventListener('keydown', e=>{if(e.key==='Enter') checkAnswer(false);});
}

function checkAnswer(skipped){
  if(answered) return;
  answered = true;
  const p = order[idx];
  const authorInput = document.getElementById('authorInput');
  const titleInput = document.getElementById('titleInput');
  const aVal = authorInput.value;
  const tVal = titleInput.value;
  authorInput.disabled = true;
  titleInput.disabled = true;
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('skipBtn').disabled = true;

  let correct = false;
  if(!skipped){
    correct = authorMatch(aVal,p.author) && titleKeyMatch(tVal,p.title);
    if(correct) score++;
  }

  const box = document.getElementById('revealBox');
  box.classList.add('show');
  box.innerHTML = `
    <div class="verdict ${correct?'correct':'wrong'}">${skipped? 'Ответ:' : (correct? 'Верно!' : 'Не совсем')}</div>
    <div class="answerCard">
      <p class="t">${p.title}</p>
      <p class="a">${p.author}</p>
      <p class="y">${p.year}, Государственная Третьяковская галерея</p>
    </div>
    ${!skipped?`<div class="yourAnswers">
      <div><b>Ваш автор:</b> ${aVal || '—'}</div>
      <div><b>Ваше название:</b> ${tVal || '—'}</div>
    </div>`:''}
    <div class="row" style="margin-top:16px;">
      <button class="btn-primary" id="nextBtn">${idx+1<order.length? 'Следующая картина' : 'Показать результат'}</button>
    </div>
  `;
  document.getElementById('nextBtn').addEventListener('click', next);
  scoreLabel.textContent = `${score} верных`;
}

function next(){
  idx++;
  if(idx>=order.length){
    finish();
  } else {
    render();
  }
}

function finish(){
  quizArea.style.display='none';
  finalArea.style.display='block';
  progressFill.style.width='100%';
  qCounter.textContent = `Вопрос ${order.length} из ${order.length}`;
  const pct = Math.round((score/order.length)*100);
  let comment;
  if(pct>=85) comment = "Отличный результат — вы настоящий знаток Третьяковки.";
  else if(pct>=60) comment = "Хороший результат! Ещё немного — и вы искусствовед.";
  else if(pct>=35) comment = "Неплохое начало — самое время сходить в галерею.";
  else comment = "Есть повод устроить прогулку по залам Лаврушинского переулка.";

  const periodLabel = currentPeriodId==="__all__" ? "Все эпохи" : (PERIODS.find(p=>p.id===currentPeriodId)||{}).label || "";

  finalArea.innerHTML = `
    <div class="finalScreen">
      <div class="eyebrow">Результат · ${periodLabel}</div>
      <div class="big">${score} / ${order.length}</div>
      <p>${comment}</p>
      <div class="row" style="justify-content:center;margin-top:20px;">
        <button class="btn-primary" id="restartBtn" style="flex:none;">Пройти этот раздел ещё раз</button>
        <button class="btn-ghost" id="changePeriodBtn" style="flex:none;">Выбрать другую эпоху</button>
      </div>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    startQuiz(currentPeriodId);
  });
  document.getElementById('changePeriodBtn').addEventListener('click', ()=>{
    renderPeriodSelect();
  });
}

renderPeriodSelect();
</script>
</body>
</html>
